<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>国考报名照片处理工具</title>
    <meta
      name="description"
      content="在浏览器本地校验、裁切并导出 295×413 报名照片，支持 JPG/PNG/WebP/BMP/TIFF，照片不离开本机。"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <!-- B站 Toy SDK. Optional: the page falls back to a normal browser download
         outside the App. `defer` keeps a slow/blocked SDK from delaying app.js. -->
    <script defer src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
    <!-- Cloudflare Web Analytics. `async` keeps a slow/blocked beacon from
         delaying the app.js module (which starts the worker). -->
    <script
      type="module"
      async
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "becbcd11260241b093a0046707004203"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <main class="app">
      <header class="intro">
        <h1>国考报名照片处理工具</h1>
        <p class="lede">本地处理 · 不上传 · JPG 处理与官方工具一致。仅供学习交流使用，本人不承担使用本工具带来的后果。</p>
      </header>

      <label
        id="drop"
        class="drop"
        for="file-input"
        role="button"
        tabindex="0"
        aria-describedby="drop-hint"
      >
        <span class="drop-title">拖拽照片到这里，或点击选择照片</span>
        <span id="drop-hint" class="drop-hint">JPG/PNG/WebP/BMP/TIFF · 蓝底/白底 · ≥295×413 · 正面免冠</span>
        <input
          id="file-input"
          class="file-input"
          type="file"
          accept=".jpg,.jpeg,.jpe,.jfif,.png,.webp,.bmp,.tif,.tiff,image/jpeg,image/png,image/webp,image/bmp,image/x-ms-bmp,image/tiff,image/x-tiff"
          tabindex="-1"
        />
      </label>

      <p id="status" class="status" role="status" aria-live="polite" data-state="loading">
        正在加载处理引擎…
      </p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="result" class="result" aria-label="处理结果" hidden>
        <img id="preview" class="preview" alt="处理后的报名照片预览" />
        <div class="result-body">
          <p class="result-title">处理成功</p>
          <p id="meta" class="meta"></p>
          <a id="download" class="download" download="报名照片.jpg">保存照片</a>
          <p class="result-note">照片未上传；B站 App 内保存到相册，网页端下载 JPG，保存后可直接用于报名。</p>
        </div>
      </section>

      <p class="tip">手机照片如方向不对，请先在相册中导出为正向图片。</p>

      <footer class="footer">
        C++ + OpenCV + WebAssembly · 照片不离开本机 · 访问统计：Cloudflare
        <span aria-hidden="true">·</span>
        <a href="https://github.com/hr3lxphr6j/gwyzpclgj-web" target="_blank" rel="noopener noreferrer">开源地址</a>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
